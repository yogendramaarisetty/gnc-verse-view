name: Build and Test

on:
  push:
    branches: [ main, enhance ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Test migration system
      run: |
        echo "🧪 Testing migration system..."
        npm run migrate:test
        
    - name: Run database migrations (if credentials available)
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo "🔄 Running database migrations..."
          npm run migrate || echo "⚠️ Migrations failed, but continuing..."
          echo "📊 Checking migration status..."
          npm run migrate:status || echo "⚠️ Migration status check failed"
        else
          echo "⚠️ Skipping migrations (no Supabase credentials)"
        fi
        
    - name: Build project
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
      run: npm run build
        
    - name: Build Success Summary
      run: |
        echo "🎉 Build completed successfully!"
        echo "📦 Build artifacts are ready"
        echo ""
        echo "📋 Next steps for deployment:"
        echo "1. Set up Vercel project: https://vercel.com"
        echo "2. Configure environment variables:"
        echo "   - NEXT_PUBLIC_SUPABASE_URL"
        echo "   - NEXT_PUBLIC_SUPABASE_ANON_KEY" 
        echo "   - SUPABASE_SERVICE_ROLE_KEY"
        echo "3. Connect GitHub repository to Vercel"
        echo "4. Deploy automatically on push"
